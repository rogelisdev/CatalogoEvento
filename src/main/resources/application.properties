spring.application.name=catalogoDeEventosYVenues

# Default active profile
spring.profiles.active=dev

# Server configuration
server.port=8080

# ==============================
# MYSQL DATABASE CONFIGURATION
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo?useSSL=false&serverTimezone=UTC
spring.datasource.username=rogelisdev
spring.datasource.password=Rogelis1234*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging configuration
logging.level.root=INFO
logging.level.com.tiquetera=DEBUG

# Reduce warnings for handled exceptions (404, 400)
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

# Validation configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
