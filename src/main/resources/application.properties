spring.application.name=catalogoDeEventosYVenues

#Perfil activo por defecto

spring.profiles.active=dev

#Configuracion de servidor

server.port=8080

# ==============================
# CONFIGURACION DE BASE DE DATOS MYSQL
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/pruebas
spring.datasource.username=rogelis
spring.datasource.password=Rogelis1234*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ==============================
# FLYWAY CONFIGURATION
# ==============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Query optimization settings
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.default_batch_fetch_size=10
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# SQL logging with parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.stat=DEBUG


#Configuracion de logging

logging.level.root=INFO
logging.level.com.tiquetera=DEBUG

#Reduce warnings de excepciones manejadas (404, 400)

logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

#Configuracion de validacion

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
